version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - unconvert
    - gocritic
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tonklasocute/mallowtick
